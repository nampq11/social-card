<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9d5cff"/>
      <stop offset="1" stop-color="#6e2bff"/>
    </linearGradient>
  </defs>
  <!-- App tile: iOS-style squircle -->
  <rect width="64" height="64" rx="14.5" fill="url(#tile)"/>
  <!-- Back card: tilted, suggests the studio stack -->
  <rect x="25" y="13" width="24" height="31" rx="4.5" fill="#ffffff" opacity="0.38" transform="rotate(8 37 28.5)"/>
  <!-- Front card: the social card (4:5 portrait) -->
  <rect x="15" y="17" width="24" height="31" rx="4.5" fill="#ffffff"/>
  <!-- Card content: avatar + name lines, bio lines -->
  <circle cx="22.5" cy="25" r="3" fill="#863bff"/>
  <rect x="27.5" y="22.8" width="7.5" height="2.1" rx="1.05" fill="#c9a8ff"/>
  <rect x="27.5" y="26.1" width="5.5" height="2.1" rx="1.05" fill="#e3d5ff"/>
  <rect x="19.5" y="33" width="15" height="2.1" rx="1.05" fill="#e8e0f5"/>
  <rect x="19.5" y="37.4" width="10.5" height="2.1" rx="1.05" fill="#efeaf8"/>
  <rect x="19.5" y="41.8" width="7" height="2.1" rx="1.05" fill="#efeaf8"/>
</svg>
