<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Card — Minimalist Card Studio</title>
    <style>
      /* Paint the shell's background for the system color scheme before the
         app mounts, so dark-mode users get no light-theme flash. */
      body {
        background: #f5f5f7;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0b0c;
        }
      }
    </style>
    <!-- Fonts: Be Vietnam Pro (the only family referenced in the app) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      if (window.location.pathname === '/' || window.location.pathname === '') {
        window.history.replaceState(null, '', '/social-card')
      }
    </script>
  </head>
  <body class="text-[#1D1D1F] antialiased selection:bg-blue-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
